<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS WebGPU Test</title><style>body{margin:0;background:#0b1118;color:#eaf2f7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px}.box{max-width:650px;margin:auto;background:#121d27;border:1px solid #2b4050;border-radius:16px;padding:20px}h1{font-size:22px;letter-spacing:3px}.item{padding:14px;border-bottom:1px solid #263642}.ok{color:#75dfb2}.ng{color:#ff8d8d}.note{color:#a8b6c2;font-size:13px;line-height:1.6}button{width:100%;padding:14px;border-radius:10px;border:1px solid #3c94a4;background:#185765;color:white;font-size:16px;margin-top:16px}</style></head><body><div class="box"><h1>J.A.R.V.I.S.</h1><p>LOCAL AI DIAGNOSTIC</p><div class="item">Safari / WebGPU: <b id="gpu">確認中…</b></div><div class="item">Secure Context: <b id="secure">確認中…</b></div><div class="item">Device Memory API: <b id="mem">確認中…</b></div><div class="item">結論: <b id="result">判定中…</b></div><p class="note" id="detail">AIを起動せず、iPhone側の実行環境だけを確認します。</p><button onclick="location.reload()">再チェック</button></div><script>const gpu=!!navigator.gpu,sec=window.isSecureContext,mem=navigator.deviceMemory||null;function set(id,ok,text){const e=document.getElementById(id);e.textContent=text;e.className=ok?'ok':'ng'}set('gpu',gpu,gpu?'利用可能':'利用不可');set('secure',sec,sec?'HTTPS環境':'HTTPSではありません');set('mem',!!mem,mem?(mem+' GB相当'):'取得不可');const ok=gpu&&sec;document.getElementById('result').textContent=ok?'ローカルAIテストへ進めます':'この環境では、そのままでは進めません';document.getElementById('result').className=ok?'ok':'ng';document.getElementById('detail').textContent=ok?'WebGPUが見えています。次は小型モデルを読み込むJARVIS本体へ進めます。':'まずHTTPSで開く必要があります。';</script></body></html>
